<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IALatinPro - TV 3D Interactiva</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* --- FONDO TOTALMENTE NEGRO --- */
            background-color: #000000; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', Arial, Helvetica, sans-serif;
            overflow: hidden;
            position: relative;
            cursor: none; /* Ocultamos el cursor nativo */
            
            /* Perspectiva 3D para que la TV pueda rotar en profundidad */
            perspective: 1200px; 
            perspective-origin: center center;
        }

        /* --- EL MARCO DE LA TV --- */
        .tv-container {
            position: relative;
            width: 600px;
            height: 400px;
            background: #111111; /* Bisel negro del televisor */
            border-radius: 40px;
            padding: 25px; /* Grosor del marco */
            box-shadow: 
                0 40px 100px rgba(0,0,0,1), /* Sombra exterior muy profunda sobre el fondo negro */
                inset 0 0 30px rgba(0,0,0,0.8); /* Sombra interior del bisel */
            
            /* Estilo 3D para el marco */
            transform-style: preserve-3d;
            
            /* Suavidad del movimiento 3D */
            transition: transform 0.15s ease-out;
            
            /* Efecto de borde metálico sutil */
            border: 1px solid #2a2a2a;
        }

        /* --- LA PANTALLA DENTRO DE LA TV --- */
        .tv-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #e6e6e6; /* Fondo gris claro para alto contraste con el ruido */
            border-radius: 20px; /* Bordes redondeados de la pantalla CRT */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.4); /* Profundidad de la pantalla */
        }

        /* --- CAPA DE RUIDO DE TV (ALTO CONTRASTE E INTENSO) --- */
        .capa-ruido {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.45; /* Ruido MUCHO más intenso y visible */
            
            /* Filtro SVG para generar el ruido fractal */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            
            /* Animación de desplazamiento constante para simular el movimiento de la estática */
            animation: ruido-movimiento 0.4s steps(4) infinite;
            
            /* Mezcla para un contraste más duro */
            mix-blend-mode: multiply;
        }

        /* Duplicamos la capa de ruido para hacerlo aún más denso */
        .capa-ruido::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: inherit;
            opacity: 0.6;
            animation: ruido-movimiento 0.3s steps(3) infinite reverse;
        }

        @keyframes ruido-movimiento {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-8%, -8%); }
            50% { transform: translate(8%, 8%); }
            75% { transform: translate(-8%, 8%); }
            100% { transform: translate(0, 0); }
        }

        /* --- GLITCH DE PELÍCULA GENERAL DENTRO DE LA TV --- */
        @keyframes glitch-general {
            0%, 85%, 100% { transform: translate(0, 0) scale(1); clip-path: inset(0 0 0 0); }
            86% { transform: translate(-8px, 0) scale(1.01); clip-path: inset(20% 0 80% 0); }
            87% { transform: translate(6px, 0) scale(0.98); clip-path: inset(10% 0 90% 0); }
            88% { transform: translate(0, 0) scale(1); clip-path: inset(0 0 0 0); }
            92% { transform: translate(0, 0) scale(1); clip-path: inset(0 0 0 0); }
            93% { transform: translate(-3px, 3px) scale(1.02); clip-path: inset(50% 0 50% 0); }
            94% { transform: translate(3px, -3px) scale(0.98); clip-path: inset(40% 0 60% 0); }
            95% { transform: translate(0, 0) scale(1); clip-path: inset(0 0 0 0); }
        }

        .contenido-tv {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: glitch-general 7s infinite steps(1);
            transform-style: preserve-3d;
        }

        /* --- ESTILO DEL TEXTO --- */
        .texto-principal {
            font-family: 'Montserrat', 'Helvetica Neue', 'Arial Black', sans-serif;
            font-size: 2.8rem; /* Un poco más pequeño para que quepa bien en la TV */
            font-weight: 900;
            color: #0a111f;
            letter-spacing: -2.5px; 
            position: relative;
            z-index: 2;
            cursor: default;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
        }

        .texto-principal:hover {
            transform: translateY(-5px) scale(1.02);
            text-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* --- ESTILO DEL BOTÓN --- */
        .btn-proximamente {
            margin-top: 2rem;
            padding: 8px 24px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #0a111f;
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid #0a111f;
            border-radius: 30px;
            cursor: none;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-proximamente:hover {
            background: #0a111f;
            color: #ffffff;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* --- LIENZO DE PARTÍCULAS (PEQUEÑAS Y CON CONTRASTE) --- */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* --- VENTANA MODAL --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-overlay.mostrar {
            display: flex;
        }

        .modal-contenido {
            background: #ffffff;
            padding: 2.5rem 3rem;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-overlay.mostrar .modal-contenido {
            transform: scale(1);
        }

        .modal-contenido h2 {
            font-family: 'Montserrat', 'Arial Black', sans-serif;
            font-size: 1.6rem;
            color: #0a111f;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .modal-contenido p {
            font-size: 1rem;
            color: #555;
            margin-bottom: 20px;
        }

        .correo-destacado {
            display: block;
            font-size: 1.3rem;
            font-weight: 600;
            color: #0a111f;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 12px;
            margin: 20px 0;
            word-break: break-all;
            border: 1px solid #e0e0e0;
        }

        .btn-cerrar {
            margin-top: 10px;
            padding: 10px 30px;
            font-size: 0.9rem;
            font-weight: 600;
            color: white;
            background: #0a111f;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-cerrar:hover {
            background: #2c3e50;
            transform: scale(1.02);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .tv-container {
                width: 90%;
                height: auto;
                aspect-ratio: 16/10;
                padding: 15px;
                border-radius: 25px;
            }
            .texto-principal { font-size: 2rem; }
            .btn-proximamente { font-size: 0.7rem; padding: 6px 16px; margin-top: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- MARCO DE LA TV CON MOVIMIENTO 3D -->
    <div class="tv-container" id="tvFrame">
        
        <!-- PANTALLA DE LA TV -->
        <div class="tv-screen">
            
            <!-- CAPA DE RUIDO DE TV (INTENSO Y MÓVIL) -->
            <div class="capa-ruido"></div>

            <!-- CONTENIDO (Texto y Botón) -->
            <div class="contenido-tv">
                <h1 class="texto-principal">IALatinPro</h1>
                <button class="btn-proximamente" id="abrirModal">Próximamente</button>
            </div>
            
        </div>
    </div>

    <!-- LIENZO PARA LAS PARTÍCULAS (PEQUEÑAS) -->
    <canvas id="particleCanvas"></canvas>

    <!-- VENTANA MODAL -->
    <div class="modal-overlay" id="miModal">
        <div class="modal-contenido">
            <h2>Próximamente</h2>
            <p>Estamos trabajando en algo increíble.</p>
            <span class="correo-destacado">oficial@ialatinpro.com</span>
            <button class="btn-cerrar" id="cerrarModal">Cerrar</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // --- Lógica del Modal ---
        const abrirBtn = document.getElementById('abrirModal');
        const cerrarBtn = document.getElementById('cerrarModal');
        const modal = document.getElementById('miModal');
        const tvFrame = document.getElementById('tvFrame');

        abrirBtn.addEventListener('click', () => {
            modal.classList.add('mostrar');
        });

        cerrarBtn.addEventListener('click', () => {
            modal.classList.remove('mostrar');
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('mostrar');
            }
        });

        // --- MOVIMIENTO 3D DE LA TV CON EL CURSOR ---
        document.addEventListener('mousemove', (e) => {
            // Calculamos el centro de la pantalla
            const x = (window.innerWidth / 2 - e.clientX) / 30;
            const y = (window.innerHeight / 2 - e.clientY) / 30;
            
            // Aplicamos la rotación 3D a la TV (Eje X e Y)
            tvFrame.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });

        // --- SISTEMA DE PARTÍCULAS (MÁS PEQUEÑAS Y CON GRAVEDAD) ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        let mouseX = 0;
        let mouseY = 0;

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // Partículas más pequeñas (1 a 3px)
                this.size = Math.random() * 2 + 1; 
                this.vy = (Math.random() - 0.5) * 1 + 0.2; /* Ligera gravedad hacia abajo */
                this.vx = (Math.random() - 0.5) * 1.5;
                this.color = Math.random() > 0.5 ? '#000000' : '#ffffff'; // Alto contraste
                this.life = 1.0; 
                this.decay = Math.random() * 0.015 + 0.01;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05; // Aceleración de la gravedad
                this.life -= this.decay;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life * 0.9;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function createParticles(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // Creamos menos partículas por frame para que sean sutiles y no saturen
            for (let i = 0; i < 3; i++) {
                const offsetX = (Math.random() - 0.5) * 15;
                const offsetY = (Math.random() - 0.5) * 15;
                particles.push(new Particle(mouseX + offsetX, mouseY + offsetY));
            }
        }

        document.addEventListener('mousemove', createParticles);

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].life <= 0 || particles[i].y > canvas.height) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>
</html>
